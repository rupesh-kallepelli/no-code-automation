{{- if .Values.route.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ollama
  namespace: {{ .Values.namespace }}
spec:
  host: ollama-{{ .Values.namespace }}.apps.{{ .Values.ocProject }}.openshiftapps.com
  to:
    kind: Service
    name: ollama
  port:
    targetPort: http
  tls:
    termination: edge
  {{- end }}
