apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-proxy-config
data:
  nginx.conf: |
    error_log /dev/stderr info;
    pid /tmp/nginx.pid;

    worker_processes 1;

    events {
        worker_connections 1024;
    }

    http {
        # WebSocket upgrade handling
        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
        }

        server {
            listen 9222;

            # Health check
            location = /healthz {
                return 200 'ok';
                add_header Content-Type text/plain;
            }

            # Dynamic routing to sidecar
            location /ws/ {
                # Extract sidecar host/port and browser port/path
                set $sidecar_host $arg_host;
                set $sidecar_port $arg_port;
                set $browser_port $arg_browserPort;
                set $browser_path $arg_path;

                # Forward to sidecar, passing browser port/path as query
                proxy_pass http://$sidecar_host:$sidecar_port/ws/?host=127.0.0.1&port=$browser_port&path=$browser_path;

                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "Upgrade";

                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                proxy_buffering off;
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
            }
        }
    }