namespace: kallepallirupesh-dev
ocProject: rm2.thpm.p1

replicaCount: 1

image:
  repository: registry.access.redhat.com/ubi9/nginx-120
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9222

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 250m
    memory: 128Mi

nginx:
  wsProxyLocation: /ws/

browserProxy:
  cachePath: /var/cache/nginx
  configPath: /etc/nginx/conf.d