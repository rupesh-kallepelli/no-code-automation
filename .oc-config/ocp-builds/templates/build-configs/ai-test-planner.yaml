apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: ai-test-planner
spec:
  source:
    type: Binary
  strategy:
    type: Source
    sourceStrategy:
      from:
        kind: ImageStreamTag
        name: jdk17-slim:latest
  output:
    to:
      kind: ImageStreamTag
      name: ai-test-planner:latest