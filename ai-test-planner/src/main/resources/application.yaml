server:
  port: 8080
spring:
  application:
    name: ai-test-planner
  servlet:
    multipart:
      enabled: true
      max-file-size: 200MB
      max-request-size: 200MB
  kafka:
    bootstrap-servers: >-
      kafka-0-ext:9092,
      kafka-1-ext:9092,
      kafka-2-ext:9092
    consumer:
      group-id: test-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  ai:
    vectorstore:
      pgvector:
        initialize-schema: true
    ollama:
      base-url: http://ollama:11434
      chat:
        options:
          model: llama3.3:70b
          temperature: 0
          top-p: 0.1
      embedding:
        options:
          model: bge-m3
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,liveness   # expose actuator endpoints
  metrics:
    export:
      prometheus:
        enabled: true                     # enable Prometheus registry
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessstate:
      enabled: true
